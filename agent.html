/* Salva a URL do Cloudflare Worker no localStorage */
function saveWorkerUrl() {
  const url = document.getElementById('workerUrlInput')?.value.trim();
  if (!url) return; // não salva se o campo estiver vazio
  S.workerUrl = url;
  localStorage.setItem('drk_agent_worker', url);
  showToast('Worker URL salva!');
  addLog('🔗 Cloudflare Worker configurado.', 'info');
  renderContent(); // atualiza o card de "Modo ativo"
}

/*
  Salva a chave da API Groq no localStorage.
  Se o campo estiver vazio, remove a chave (equivale a desconfigurar).
  POR QUE localStorage.removeItem em vez de setItem('')?
  → removeItem() limpa completamente a entrada.
    setItem('') guardaria uma string vazia, que seria carregada
    na próxima sessão e confundiria a lógica de verificação.
*/
function saveApiKey() {
  const key = document.getElementById('apiKeyInput')?.value.trim();
  S.apiKey = key;
  if (key) {
    localStorage.setItem('drk_agent_key', key);
    showToast('Chave API salva!');
    addLog('🔑 Chave API direta configurada (modo local).', 'info');
  } else {
    localStorage.removeItem('drk_agent_key');
    showToast('Chave API removida.');
    addLog('🗑 Chave API removida.', 'info');
  }
  renderContent();
}

/* Limpa o campo de chave e salva (equivale a remover a chave) */
function clearApiKey() {
  document.getElementById('apiKeyInput').value = '';
  saveApiKey();
}

/*
  Reseta o histórico de posts vistos.
  Útil quando:
  - O admin quer re-processar notícias antigas
  - Algo deu errado e os posts foram marcados como vistos sem gerar
*/
function resetSeen() {
  S.seenGids = new Set(); // cria um Set vazio — todos os posts serão considerados "novos"
  saveSeen();
  addLog('🔄 Histórico resetado. Todos os posts serão re-processados.', 'info');
  renderContent();
}


/*
  ════════════════════════════════════════════════════════════════
  CONTROLE DE ABAS
  ════════════════════════════════════════════════════════════════
  POR QUE abas em vez de páginas separadas?
  → Tudo em uma página evita recarregamentos. Os dados em memória
    (S.pendingPosts, S.logs) são mantidos ao trocar de aba.
    Se fossem páginas separadas, os dados seriam perdidos.
*/
function setTab(tab) {
  S.activeTab = tab;
  renderContent();    // renderiza o conteúdo da nova aba
  updateTabLabels();  // atualiza quais botões de aba ficam destacados
}

/*
  Atualiza o texto e o estado visual dos botões de aba.
  POR QUE classList.toggle('active', condição)?
  → Adiciona a classe 'active' se a condição for true,
    remove se for false — em uma só chamada.
*/
function updateTabLabels() {
  const labels = {
    posts:  `📋 Posts (${S.pendingPosts.length})`,
    config: '⚙️ Configurar',
    logs:   `📜 Logs (${S.logs.length})`,
  };
  document.querySelectorAll('.tab-btn').forEach(btn => {
    const t = btn.dataset.tab; // lê o atributo data-tab do botão
    btn.textContent = labels[t] || t;
    btn.classList.toggle('active', t === S.activeTab);
  });
}


/*
  ════════════════════════════════════════════════════════════════
  RENDERIZAÇÃO — gera o HTML que aparece na tela
  ════════════════════════════════════════════════════════════════
  POR QUE gerar HTML via JavaScript em vez de ter divs fixas no HTML?
  → O conteúdo é dinâmico (lista de posts muda, logs crescem).
    Gerar o HTML via JS permite construir exatamente o que é necessário
    com os dados atuais, sem precisar manipular dezenas de elementos.

  POR QUE innerHTML e não createElement()?
  → innerHTML é mais simples de ler e escrever para estruturas complexas.
    createElement seria mais verboso e difícil de entender.
    Para este painel de admin interno, a legibilidade vale mais.
*/
function render() {
  // Gera os botões de aba dinamicamente a partir do array ['posts','config','logs']
  const tabsRow = document.getElementById('tabsRow');
  if (tabsRow) {
    tabsRow.innerHTML = ['posts','config','logs'].map(t => `
      <button class="tab-btn${S.activeTab===t?' active':''}" data-tab="${t}"
        onclick="setTab('${t}')">
        ${{ posts:`📋 Posts (${S.pendingPosts.length})`, config:'⚙️ Configurar', logs:`📜 Logs (${S.logs.length})` }[t]}
      </button>`).join('');
  }
  updateStatus();
  updateToggleBtn();
  renderContent();
}

/* Decide qual aba renderizar e atualiza a área de conteúdo */
function renderContent() {
  const el = document.getElementById('agentContent');
  if (!el) return;
  if (S.activeTab === 'posts')  el.innerHTML = postsHTML();
  if (S.activeTab === 'config') el.innerHTML = configHTML();
  if (S.activeTab === 'logs')   el.innerHTML = logsHTML();
}


/*
  ── ABA DE POSTS ──
  Mostra a lista de posts pendentes com opções de editar, publicar e deletar.
  Ou uma mensagem de estado vazio se não houver posts.
*/

/* Converte o nome da tag para a classe CSS correspondente */
function tagClass(tag) {
  return { 'ATUALIZAÇÃO': 'atualizacao', 'EVENTO': 'evento', 'NOTÍCIAS': 'noticias' }[tag] || 'noticias';
}

function postsHTML() {
  // Estado vazio: instrui o admin a iniciar o agente
  if (S.pendingPosts.length === 0) return `
    <div class="empty">
      <div class="empty-icon">🤖</div>
      <p class="empty-title">Nenhum post pendente</p>
      <p class="empty-sub">Clique em ▶ Iniciar ou ↺ Buscar Agora para gerar novidades da Steam</p>
    </div>`;

  /*
    .map((p, i) => ...) percorre cada post e gera um card HTML.
    'i' é o índice (posição) do post no array — usado para identificar
    qual post o admin está editando/publicando/deletando.
    .join('') une todos os cards em uma string HTML contínua.
  */
  return S.pendingPosts.map((p, i) => `
    <div class="post-card">
      <div class="card-head">
        <div class="card-meta">
          <span class="tag tag-${tagClass(p.tags[0])}">${esc(p.tags[0] || 'NOTÍCIAS')}</span>
          <span class="origin-label">Steam · ${esc(p.steamDate)}</span>
        </div>
        <div class="card-btns">
          <button class="btn-edit" onclick="toggleEdit(${i})">${p.editing ? '✕ Cancelar' : '✏️ Editar'}</button>
          <button class="btn btn-primary btn-sm" onclick="publishPost(${i})">📤 Publicar</button>
          <button class="btn-del" onclick="deletePending(${i})" title="Remover">✕</button>
        </div>
      </div>

      ${p.editing ? `
        <!-- MODO EDIÇÃO: formulário para corrigir o que a IA gerou -->
        <div class="edit-form">
          <div class="form-group">
            <label class="form-label">Título</label>
            <input id="et-${i}" class="input" value="${esc(p.title)}" />
          </div>
          <div class="form-group">
            <label class="form-label">Resumo (card)</label>
            <textarea id="ed-${i}" class="input" rows="2">${esc(p.desc)}</textarea>
          </div>
          <div class="form-row">
            <div class="form-group" style="flex:0 0 90px">
              <label class="form-label">Emoji</label>
              <input id="ee-${i}" class="input" value="${esc(p.emoji)}" />
            </div>
            <div class="form-group" style="flex:1">
              <label class="form-label">Tag</label>
              <div style="display:flex;gap:.35rem;margin-top:.3rem">
                ${['ATUALIZAÇÃO','EVENTO','NOTÍCIAS'].map(t => `
                  <button class="tag-btn${p.tags[0]===t?' active':''}"
                    onclick="setTag(${i},'${t}')">${t}</button>`).join('')}
              </div>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Corpo do artigo</label>
            <textarea id="eb-${i}" class="input" rows="9">${esc(p.body)}</textarea>
          </div>
          <!--
            GERENCIADOR DE IMAGENS
            Só aparece se houver imagens disponíveis.
            Cada miniatura mostra seu estado (selecionada/capa/exluída)
            e botões de controle na barra inferior.
          -->
          ${(p.images && p.images.length > 0) ? `
          <div class="img-manager">
            <div class="form-label" style="margin-bottom:.5rem">
              📷 Imagens &nbsp;
              <span style="color:var(--text-m);font-weight:400">
                ${(p.selectedImages||[]).length} de ${p.images.length} selecionada(s)
              </span>
            </div>

            <!-- Botões de ação em massa -->
            <div style="display:flex;gap:.35rem;margin-bottom:.5rem;flex-wrap:wrap">
              <button class="btn btn-outline btn-sm" onclick="selectAllImgs(${i},true)">✓ Selecionar todas</button>
              <button class="btn btn-outline btn-sm" onclick="selectAllImgs(${i},false)">✕ Desmarcar todas</button>
            </div>

            <!-- Grade de miniaturas -->
            <div class="img-grid">
              ${p.images.map(url => {
                const sel     = (p.selectedImages||[]).includes(url);
                const isCover = p.coverImage === url;
                const selIdx  = (p.selectedImages||[]).indexOf(url);
                const selLen  = (p.selectedImages||[]).length;
                // Usa aspas simples dentro do atributo onclick, escapando a URL em variável separada
                const safeUrl = url.replace(/'/g, "\\'");
                return `
                <div class="img-item${sel?' selected':''}${isCover?' is-cover':''}">
                  <!-- Clique na imagem = alterna seleção -->
                  <img src="${url}" title="${url}" onclick="toggleImage(${i},'${safeUrl}')" />
                  <div class="img-badges">
                    ${isCover ? '<span class="img-badge img-badge-cover">CAPA</span>' : ''}
                    ${sel && !isCover ? '<span class="img-badge img-badge-on">✓</span>' : ''}
                  </div>
                  <div class="img-controls">
                    <!-- ⭐ = tornar capa; só aparece se selecionada e não é capa ainda -->
                    <button class="img-ctrl star" title="Usar como capa"
                      onclick="setCover(${i},'${safeUrl}')"
                      ${!sel || isCover ? 'disabled' : ''}>⭐</button>
                    <!-- ← → movem na ordem das selecionadas -->
                    <button class="img-ctrl" title="Mover para esquerda"
                      onclick="moveImgUp(${i},'${safeUrl}')"
                      ${selIdx <= 0 ? 'disabled' : ''}>←</button>
                    <button class="img-ctrl" title="Mover para direita"
                      onclick="moveImgDown(${i},'${safeUrl}')"
                      ${selIdx < 0 || selIdx >= selLen-1 ? 'disabled' : ''}>→</button>
                  </div>
                </div>`;
              }).join('')}
            </div>

            <!-- Posicionamento das imagens no artigo publicado -->
            <div class="form-label" style="margin-top:.85rem;margin-bottom:.4rem">Posição no artigo</div>
            <div class="placement-row">
              <button class="placement-btn${(p.imgPlacement||'gallery')==='gallery'?' active':''}"
                onclick="setImgPlacement(${i},'gallery')">
                🖼️ Galeria ao final
              </button>
              <button class="placement-btn${p.imgPlacement==='split'?' active':''}"
                onclick="setImgPlacement(${i},'split')">
                📄 Intercaladas no texto
              </button>
            </div>
            <p style="font-size:.72rem;color:var(--text-m);margin-top:.3rem">
              ${(p.imgPlacement||'gallery')==='gallery'
                ? 'Todas as imagens aparecem em grade após o texto do artigo.'
                : 'A IA posiciona marcadores [IMAGEM] no texto indicando onde cada imagem aparece — cada imagem fica no contexto certo.'}
            </p>
          </div>
          ` : '<p style="font-size:.78rem;color:var(--text-m);margin-top:.5rem">📷 Nenhuma imagem encontrada para este post.</p>'}

          <button class="btn btn-primary" onclick="saveEdit(${i})">💾 Salvar alterações</button>
        </div>
      ` : `
        <!-- MODO VISUALIZAÇÃO: prévia do post como aparecerá no site -->
        <div class="card-title">${esc(p.emoji)} ${esc(p.title)}</div>
        ${p.subtitle ? `<p class="card-sub">${esc(p.subtitle)}</p>` : ''}
        <p class="card-preview">${esc(p.desc)}</p>

        ${p.images && p.images.length > 0 ? `
          <!-- Miniaturas das imagens extraídas do post original da Steam.
               Clique na imagem para abrir em nova aba e conferir o original.
               A primeira imagem será usada como capa do card no site. -->
          <div class="card-images">
            ${p.images.map(url => `<img src="${url}" title="${url}" onclick="window.open('${url}','_blank')" />`).join('')}
          </div>
          <p class="card-img-count">📷 ${p.images.length} imagem${p.images.length > 1 ? 's' : ''} encontrada${p.images.length > 1 ? 's' : ''} · a 1ª será a capa do card</p>
        ` : `
          <p class="card-img-count">📷 Nenhuma imagem encontrada neste post</p>
        `}

        <div class="card-footer">
          <a href="${esc(p.steamUrl||'')}" target="_blank" rel="noreferrer" class="steam-link">Ver original na Steam ↗</a>
          <span class="origin-label">Gerado: ${esc(p.generatedAt)}</span>
        </div>
      `}
    </div>`).join('');
}


/*
  ── ABA DE CONFIGURAÇÃO ──
  Exibe e permite alterar as configurações do agente.
*/
function configHTML() {
  /*
    Determina o modo ativo com base no que está configurado.
    POR QUE apiKey tem prioridade sobre workerUrl?
    → Em modo de teste local, sempre usamos a chave direta.
      O Worker é para produção — se ambos estiverem configurados,
      assumimos que ainda estamos em modo de teste.
  */
  const modeActive = S.apiKey ? 'chave-direta' : S.workerUrl ? 'worker' : 'nenhum';
  const modeLabel  = {
    'chave-direta': '🔑 Modo: Groq API (gratuito)',
    worker:         '🌐 Modo: Cloudflare Worker (produção)',
    nenhum:         '⚠️ Sem conexão configurada',
  }[modeActive];
  // Cor varia por modo: vermelho = sem conexão, laranja = direto, verde = worker
  const modeColor  = modeActive === 'nenhum' ? 'var(--red)' : modeActive === 'chave-direta' ? 'var(--orange)' : 'var(--green)';

  return `
    <!-- Card de status do modo atual -->
    <div class="config-section" style="border-color:${modeColor}33">
      <div class="config-title">📡 Modo ativo</div>
      <p style="font-size:.85rem;color:${modeColor};font-family:'Cinzel',serif">${modeLabel}</p>
      ${modeActive === 'chave-direta' ? `<p class="config-note" style="margin-top:.5rem">Usando Llama 3.3 70B via Groq — gratuito, 14.400 req/dia.</p>` : ''}
    </div>

    <!-- Configuração da chave API Groq (modo local/teste) -->
    <div class="config-section">
      <div class="config-title">🔑 Chave API Groq (gratuita)</div>
      <p class="config-note">Cole sua chave do Groq aqui. Crie gratuitamente em console.groq.com → API Keys → Create API Key.</p>
      <div style="display:flex;gap:.5rem">
        <!-- type="password" oculta a chave com asteriscos por segurança -->
        <input id="apiKeyInput" type="password" class="input"
          placeholder="gsk_..."
          value="${esc(S.apiKey)}" style="flex:1" />
        <button class="btn btn-primary" onclick="saveApiKey()">Salvar</button>
        <!-- Botão de limpar só aparece se já houver uma chave configurada -->
        ${S.apiKey ? `<button class="btn btn-danger" onclick="clearApiKey()">✕</button>` : ''}
      </div>
      <p class="config-status" style="color:${S.apiKey ? 'var(--green)' : 'var(--text-m)'}">
        ${S.apiKey ? '✅ Chave Groq configurada' : '— Não configurada'}
      </p>
    </div>

    <!-- Configuração do Cloudflare Worker (modo produção) -->
    <div class="config-section">
      <div class="config-title">🔗 URL do Cloudflare Worker (produção)</div>
      <p class="config-note">Recomendado para produção — a chave da API fica no Worker e nunca é exposta no browser. Se ambos estiverem configurados, a chave direta tem prioridade.</p>
      <div style="display:flex;gap:.5rem">
        <input id="workerUrlInput" type="url" class="input"
          placeholder="https://seu-worker.workers.dev"
          value="${esc(S.workerUrl)}" style="flex:1" />
        <button class="btn btn-primary" onclick="saveWorkerUrl()">Salvar</button>
      </div>
      <p class="config-status" style="color:${S.workerUrl ? 'var(--green)' : 'var(--text-m)'}">
        ${S.workerUrl ? '✅ Worker configurado' : '— Não configurado'}
      </p>
    </div>

    <!-- Seleção de frequência de verificação -->
    <div class="config-section">
      <div class="config-title">⏱ Frequência de verificação</div>
      <div style="display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem">
        <!-- Gera um botão para cada intervalo definido no array IVLS -->
        ${IVLS.map(iv => `
          <button class="ivl-btn${S.intervalMs===iv.ms?' active':''}"
            data-ms="${iv.ms}" onclick="setIvl(${iv.ms})">${iv.label}</button>
        `).join('')}
      </div>
    </div>

    <!-- Reset do histórico de posts vistos -->
    <div class="config-section">
      <div class="config-title">🔄 Histórico de posts vistos</div>
      <p class="config-note">${S.seenGids.size} post(s) no histórico. Resetar fará o agente re-processar tudo.</p>
      <button class="btn btn-outline" onclick="resetSeen()">🔄 Resetar histórico</button>
    </div>`;
}


/*
  ── ABA DE LOGS ──
  Mostra o histórico de todas as ações desde que a página foi aberta.
  POR QUE os logs são apagados ao fechar a página?
  → São guardados em memória (S.logs), não em localStorage.
    Logs são informativos e temporários — não precisam persistir.
*/
function logsHTML() {
  if (S.logs.length === 0) return `
    <div class="empty">
      <p class="empty-title">Nenhum log ainda</p>
    </div>`;
  return `<div class="log-list">
    ${S.logs.map(l => `
      <div class="log-row log-${l.type}">
        <span class="log-time">${esc(l.time)}</span>
        <span class="log-msg">${esc(l.msg)}</span>
      </div>`).join('')}
  </div>`;
}

/*
  Exibe uma notificação temporária na parte inferior da tela.
  Cria um elemento, adiciona ao body, e remove após 2,5 segundos.

  POR QUE dois setTimeout encadeados?
  → O primeiro (2500ms) inicia o fade out (opacity: 0).
    O segundo (300ms depois) remove o elemento do DOM após a animação terminar.
    Se removêssemos imediatamente, o fade não seria visível.
*/
function showToast(msg) {
  const t = document.createElement('div');
  t.className   = 'agent-toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => {
    t.style.opacity = '0'; // inicia o fade out
    setTimeout(() => t.remove(), 300); // remove após a animação
  }, 2500);
}

/*
  Escapa caracteres especiais HTML para evitar XSS (Cross-Site Scripting).
  POR QUE isso é necessário?
  → Se um título da Steam contiver <script>alert('hack')<\/script>,
    e inserirmos diretamente no innerHTML, o script seria executado.
    esc() converte "<" em "&lt;" e ">" em "&gt;", tornando o texto inofensivo.

  POR QUE criar um elemento div temporário em vez de usar replace()?
  → O browser já sabe como escapar HTML corretamente. Criar um nó de texto
    e ler o innerHTML garante que TODOS os caracteres especiais sejam tratados,
    sem risco de esquecer algum caso na mão.
*/
/*
  SEGURANÇA (24/10/2026): a versão antiga não escapava aspas, e o texto
  também vai dentro de atributos (value="..."). Agora troca os cinco
  caracteres perigosos, aspas incluídas.
*/
function esc(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
</script>
