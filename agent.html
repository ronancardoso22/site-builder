<!DOCTYPE html>
<!--
  ════════════════════════════════════════════════════════════════
  AGENTE IA — DRAKANTOS
  ════════════════════════════════════════════════════════════════
  Este arquivo é o painel de controle do robô que busca novidades
  do jogo Drakantos na Steam e transforma em posts do site.

  POR QUE um arquivo separado do site principal?
  → Por segurança: a chave da API de IA não fica visível para
    visitantes comuns. Apenas quem sabe a URL "/agent.html" e
    tem a senha de administrador consegue acessar.

  POR QUE não usar um framework (React, Vue, etc.)?
  → O site inteiro é HTML/CSS/JS puro, sem servidor. Adicionar
    um framework exigiria configurar Node.js, npm, build, etc.
    O JS vanilla é suficiente e muito mais simples de manter.

  COMO FUNCIONA O FLUXO:
  1. Administrador abre agent.html e faz login
  2. Agente busca novidades da Steam (API pública)
  3. Envia o texto para a IA Groq (gratuita) que escreve um post
  4. Post fica "pendente" — admin revisa e edita se quiser
  5. Admin clica "Publicar" → post vai para o localStorage do site
  6. O site principal lê esse mesmo localStorage e exibe o post
  ════════════════════════════════════════════════════════════════
-->
<html lang="pt-BR">
<head>
  <!-- Define que o arquivo usa letras com acento (português) -->
  <meta charset="UTF-8" />
  <!-- Faz a página se adaptar ao tamanho de telas de celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drakantos · Agente IA</title>

  <!--
    Carrega as fontes do Google Fonts:
    - Cinzel: fonte decorativa para títulos e botões (estilo fantasia)
    - Crimson Pro: fonte serif elegante para textos corridos
    POR QUE preconnect? → Abre a conexão com o Google antes de precisar,
    tornando o carregamento das fontes mais rápido.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Crimson+Pro:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    /*
      ══════════════════════════════════════════════════════
      RESET E VARIÁVEIS DE COR
      ══════════════════════════════════════════════════════
      POR QUE box-sizing: border-box?
      → Por padrão no browser, padding e borda são SOMADOS
        ao tamanho do elemento. Com border-box, padding e borda
        ficam DENTRO do tamanho declarado — muito mais previsível.
        ex: um div de 200px com padding 20px continua tendo 200px.

      POR QUE margin:0 e padding:0?
      → Cada browser tem espaçamentos padrão diferentes.
        Zeramos tudo para ter controle total do layout.
    */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /*
      Variáveis CSS (--nome): definem as cores do tema em um só lugar.
      POR QUE usar variáveis em vez de colocar a cor direto?
      → Se quiser mudar o roxo para azul, muda só aqui e
        toda a página atualiza. Sem variáveis, precisaria
        procurar e trocar cada ocorrência manualmente.
    */
    :root {
      --bg:        #060910;   /* fundo escuro principal (azul quase preto) */
      --bg-card:   #111828;   /* fundo dos cartões — levemente mais claro */
      --bg-hover:  #182035;   /* fundo ao passar o mouse nos cards */
      --purple:    #8b5cf6;   /* roxo elétrico — cor de destaque principal */
      --purple-d:  #4c1d95;   /* roxo escuro — usado em gradientes */
      --gold:      #c9a84c;   /* dourado — logo e detalhes especiais */
      --text:      #eae6f8;   /* branco levemente roxo — texto principal */
      --text-s:    #8892b0;   /* cinza-azulado — texto secundário/dicas */
      --text-m:    #2d3a5c;   /* azul muito escuro — texto "apagado" */
      --border:    rgba(99,102,241,.2);  /* borda índigo semitransparente */
      --green:     #52b788;   /* verde — mensagens de sucesso */
      --red:       #e05252;   /* vermelho — erros e botões de perigo */
      --orange:    #e07c3a;   /* laranja — avisos */
      --radius:    8px;       /* arredondamento padrão dos cantos */
    }

    /*
      Define altura mínima 100% para que o fundo cubra a tela toda
      mesmo quando há pouco conteúdo.
      POR QUE font-family com fallback 'serif'?
      → Se a fonte Crimson Pro não carregar (sem internet, por ex.),
        o browser usa qualquer fonte serif disponível no sistema.
    */
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Crimson Pro', serif; }


    /* ══════════════════════════════════════════════════════
       TELA DE LOGIN (AUTH)
       ══════════════════════════════════════════════════════
       POR QUE mostrar uma tela de login?
       → Este painel tem acesso total para criar e publicar
         posts. Sem proteção, qualquer um que soubesse a URL
         poderia publicar o que quisesse no site.

       display:flex + align-items/justify-content:center
       → Centraliza o formulário tanto na vertical quanto na
         horizontal, em qualquer tamanho de tela.
    */
    #authScreen {
      min-height: 100vh;       /* ocupa pelo menos 100% da altura da janela */
      display: flex;
      align-items: center;     /* centraliza verticalmente */
      justify-content: center; /* centraliza horizontalmente */
    }

    /* Caixa branca (escura) do formulário de login */
    .auth-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;  /* limita a largura para não ficar enorme em telas grandes */
      display: flex;
      flex-direction: column; /* empilha os elementos (logo, título, inputs) verticalmente */
      gap: 1rem;              /* espaço de 1rem entre cada elemento */
    }

    /* Logo pequeno no topo do formulário */
    .auth-logo {
      font-family: 'Cinzel', serif;
      font-size: .75rem;
      letter-spacing: .12em; /* espaçamento entre letras — estilo épico */
      color: var(--gold);
      text-align: center;
    }

    .auth-title { font-family: 'Cinzel', serif; font-size: 1.4rem; text-align: center; color: var(--text); }
    .auth-sub   { font-size: .85rem; color: var(--text-s); text-align: center; }

    /*
      min-height: 1rem garante que o espaço do erro sempre existe,
      evitando que a caixa "pule" de tamanho quando o erro aparece.
    */
    .auth-error { font-size: .82rem; color: var(--red); text-align: center; min-height: 1rem; }


    /* ══════════════════════════════════════════════════════
       CAMPOS DE TEXTO (INPUTS)
       ══════════════════════════════════════════════════════
       Estilo unificado para todos os campos: email, senha,
       URL do Worker, chave API, título do post, etc.

       outline:none → remove o contorno azul feio do browser padrão.
       Substituímos por border-color roxa no :focus abaixo.
    */
    .input {
      width: 100%;
      padding: .65rem 1rem;
      background: rgba(255,255,255,.06); /* fundo levemente claro sobre o escuro */
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: #f0eaff;
      font-family: 'Crimson Pro', serif;
      font-size: 1rem;
      outline: none;
      transition: border-color .2s; /* animação suave da borda ao focar */
    }
    /* Quando o usuário clica no campo, a borda fica roxa */
    .input:focus { border-color: var(--purple); }


    /* ══════════════════════════════════════════════════════
       BOTÕES
       ══════════════════════════════════════════════════════
       POR QUE display:inline-flex?
       → Permite alinhar ícone e texto lado a lado dentro
         do botão sem precisar de CSS extra.

       POR QUE ter variações (.btn-primary, .btn-outline, etc.)?
       → Hierarquia visual: o botão principal (roxo) chama atenção,
         o outline é secundário, o danger é para ações destrutivas.
         Isso guia o usuário a entender o que é mais importante.
    */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;           /* espaço entre ícone e texto */
      padding: .55rem 1.2rem;
      border-radius: var(--radius);
      font-family: 'Cinzel', serif;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .06em;
      cursor: pointer;      /* muda o cursor para "mãozinha" ao passar por cima */
      border: none;
      transition: .2s ease; /* animação de hover suave */
      text-decoration: none;
    }
    .btn-primary          { background: var(--purple); color: #fff; }
    .btn-primary:hover    { background: #7c3aed; }            /* escurece ao passar o mouse */
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; } /* fica "apagado" quando desabilitado */
    .btn-outline          { background: transparent; color: var(--text-s); border: 1px solid var(--border); }
    .btn-outline:hover    { border-color: var(--purple); color: var(--text); }
    .btn-danger           { background: rgba(224,82,82,.15); color: var(--red); border: 1px solid rgba(224,82,82,.3); }
    .btn-danger:hover     { background: rgba(224,82,82,.3); }
    .btn-sm   { padding: .4rem .9rem; font-size: .7rem; }       /* versão menor para usar na toolbar */
    .btn-full { width: 100%; justify-content: center; }         /* ocupa toda a largura disponível */


    /* ══════════════════════════════════════════════════════
       PAINEL PRINCIPAL (após login)
       ══════════════════════════════════════════════════════
       min-height:100vh + flex-direction:column
       → O painel ocupa toda a altura da janela.
         Cabeçalho fica no topo, rodapé no fim,
         e o conteúdo no meio se expande para preencher o resto.
    */
    #mainPanel {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Cabeçalho do painel ── */
    .agent-header {
      display: flex;
      align-items: center;
      justify-content: space-between; /* título à esquerda, status à direita */
      padding: .9rem 1.5rem;
      background: #0b0f1e;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap; /* em telas pequenas quebra para nova linha */
      gap: .75rem;
    }
    .agent-header-left  { display: flex; align-items: center; gap: .75rem; }
    .agent-header-title { font-family: 'Cinzel', serif; font-size: .95rem; color: var(--text); }
    .agent-header-sub   { font-size: .75rem; color: var(--text-s); }

    /*
      Pílula de status (ex: "inativo" ou "próx. 28m 14s")
      POR QUE border-radius:20px?
      → Cria o formato de "pílula" (retângulo com bordas totalmente arredondadas).
    */
    .status-pill {
      display: flex;
      align-items: center;
      gap: .5rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: .35rem .9rem;
      font-family: 'Cinzel', serif;
      font-size: .72rem;
      color: var(--text-m);
    }
    /* Quando o agente está rodando, a borda e o texto ficam verdes */
    .status-pill.running { border-color: rgba(82,183,136,.35); color: var(--green); }

    /* Ponto colorido dentro da pílula de status */
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%; /* faz o quadrado virar círculo */
      background: var(--text-m);
      flex-shrink: 0;     /* não deixa o ponto encolher se faltar espaço */
    }
    /* Quando ativo: ponto fica verde e pulsa para indicar que está "vivo" */
    .status-dot.active {
      background: var(--green);
      box-shadow: 0 0 5px var(--green); /* brilho ao redor */
      animation: pulse 1.5s ease-in-out infinite;
    }
    /*
      Animação de pulso: o ponto alterna entre opaco e transparente,
      e entre tamanho normal e levemente maior — simula um "heartbeat".
    */
    @keyframes pulse {
      0%,100% { opacity: 1; transform: scale(1);   }
      50%      { opacity: .5; transform: scale(1.4); }
    }

    /* ── Barra de abas e ações ── */
    .agent-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: .75rem 1.5rem;
      background: #0b0f1e;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .tabs        { display: flex; gap: .35rem; }
    .toolbar-actions { display: flex; gap: .4rem; }

    /* Botões de aba (Posts / Configurar / Logs) */
    .tab-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: .45rem 1rem;
      font-family: 'Cinzel', serif;
      font-size: .7rem;
      letter-spacing: .05em;
      color: var(--text-s);
      cursor: pointer;
      transition: .2s;
    }
    .tab-btn:hover  { border-color: var(--purple); color: var(--text); }
    /* Aba ativa tem fundo roxo gradiente para se destacar das inativas */
    .tab-btn.active { background: linear-gradient(135deg, var(--purple-d), var(--purple)); border-color: var(--purple); color: #fff; }

    /*
      Área de conteúdo das abas.
      flex:1 → ocupa todo o espaço vertical restante depois do header e toolbar.
      max-width + margin:auto → centraliza o conteúdo e limita a largura
      para não ficar muito largo em monitores grandes (melhor leitura).
    */
    .agent-content {
      flex: 1;
      padding: 1.5rem;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
    }


    /* ══════════════════════════════════════════════════════
       CARDS DE POSTS PENDENTES
       ══════════════════════════════════════════════════════
       Cada card representa um post gerado pela IA que ainda
       não foi publicado no site — aguardando revisão do admin.
    */
    .post-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.2rem 1.4rem;
      margin-bottom: .9rem;
      transition: border-color .2s;
    }
    /* Destaca a borda roxa ao passar o mouse — feedback visual de interatividade */
    .post-card:hover { border-color: rgba(139,92,246,.35); }

    /* Cabeçalho do card: tag + data à esquerda, botões à direita */
    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap; /* em telas estreitas, botões vão para baixo */
      gap: .5rem;
      margin-bottom: .85rem;
    }
    .card-meta { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
    .card-btns { display: flex; align-items: center; gap: .35rem; }

    /*
      Tags coloridas por categoria:
      - ATUALIZAÇÃO → roxo
      - EVENTO       → laranja
      - NOTÍCIAS     → dourado
      POR QUE cores diferentes? → Ajuda o admin a identificar
      rapidamente o tipo de conteúdo sem ler o texto.
    */
    .tag {
      display: inline-block;
      font-family: 'Cinzel', serif;
      font-size: .62rem;
      letter-spacing: .07em;
      padding: .2rem .55rem;
      border-radius: 4px;
      font-weight: 700;
    }
    .tag-atualizacao { background: rgba(139,92,246,.18); color: var(--purple); }
    .tag-evento      { background: rgba(224,124,58,.18);  color: var(--orange); }
    .tag-noticias    { background: rgba(201,168,76,.18);  color: var(--gold); }

    .origin-label { font-size: .72rem; color: var(--text-m); font-family: 'Cinzel', serif; }
    .card-title   { font-family: 'Cinzel', serif; font-size: 1.05rem; color: var(--text); line-height: 1.35; margin-bottom: .35rem; }
    .card-sub     { font-size: .88rem; color: var(--text-s); font-style: italic; margin-bottom: .5rem; }
    .card-preview { font-size: .88rem; color: var(--text-s); line-height: 1.6; }

    /* Rodapé do card: link para Steam e data de geração */
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: .5rem;
      margin-top: .85rem;
      padding-top: .7rem;
      border-top: 1px solid var(--border); /* linha separadora acima do rodapé */
    }
    .steam-link       { font-size: .72rem; color: #60a5fa; text-decoration: none; font-family: 'Cinzel', serif; }
    .steam-link:hover { text-decoration: underline; }

    /* Botão circular vermelho de deletar — pequeno para não chamar atenção demais */
    .btn-del {
      background: rgba(224,82,82,.15);
      border: 1px solid rgba(224,82,82,.3);
      border-radius: 50%; /* círculo perfeito */
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      color: var(--red);
      font-size: .7rem;
      cursor: pointer;
      transition: .2s;
    }
    .btn-del:hover { background: rgba(224,82,82,.35); }

    /* Botão de editar — transparente até o hover para não poluir visualmente */
    .btn-edit {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: .3rem .75rem;
      font-family: 'Cinzel', serif;
      font-size: .68rem;
      color: var(--text-s);
      cursor: pointer;
      transition: .2s;
    }
    .btn-edit:hover { border-color: var(--gold); color: var(--gold); }


    /* ══════════════════════════════════════════════════════
       FORMULÁRIO DE EDIÇÃO DO POST
       ══════════════════════════════════════════════════════
       Aparece dentro do card quando o admin clica "Editar".
       POR QUE editar antes de publicar e não depois?
       → Permite corrigir erros da IA (título estranho, texto errado)
         antes que os visitantes do site vejam o post.
    */
    .edit-form {
      padding-top: .85rem;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column; /* campos empilhados verticalmente */
      gap: .85rem;
    }
    .form-group { display: flex; flex-direction: column; gap: .3rem; }
    .form-label { font-family: 'Cinzel', serif; font-size: .68rem; letter-spacing: .05em; color: var(--text-s); }
    .form-row   { display: flex; gap: .75rem; flex-wrap: wrap; } /* campos lado a lado */

    /* Botões de seleção de tag (ATUALIZAÇÃO / EVENTO / NOTÍCIAS) */
    .tag-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: .3rem .7rem;
      font-family: 'Cinzel', serif;
      font-size: .65rem;
      color: var(--text-s);
      cursor: pointer;
      transition: .2s;
    }
    .tag-btn:hover  { border-color: var(--purple); color: var(--text); }
    .tag-btn.active { background: var(--purple); border-color: var(--purple); color: #fff; }


    /* ══════════════════════════════════════════════════════
       BOTÕES DE INTERVALO (frequência de verificação)
       ══════════════════════════════════════════════════════
       border-radius:20px cria o formato arredondado de "pílula",
       diferente dos botões quadrados normais — indica que são
       opções de seleção (como radio buttons estilizados).
    */
    .ivl-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: .35rem .85rem;
      font-family: 'Cinzel', serif;
      font-size: .68rem;
      color: var(--text-s);
      cursor: pointer;
      transition: .2s;
    }
    .ivl-btn:hover  { border-color: var(--purple); color: var(--text); }
    .ivl-btn.active { background: var(--purple-d); border-color: var(--purple); color: #fff; }


    /* ══════════════════════════════════════════════════════
       SEÇÕES DE CONFIGURAÇÃO
       ══════════════════════════════════════════════════════
       Cada "seção" agrupa um conjunto de configurações relacionadas
       (ex: chave API, frequência, histórico) em um card separado.
    */
    .config-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      margin-bottom: .9rem;
    }
    .config-title  { font-family: 'Cinzel', serif; font-size: .8rem; color: var(--text); margin-bottom: .75rem; letter-spacing: .04em; }
    .config-note   { font-size: .82rem; color: var(--text-s); font-style: italic; margin-bottom: .75rem; line-height: 1.5; }
    .config-status { font-size: .8rem; margin-top: .5rem; } /* linha "✅ Configurado" ou "— Não configurado" */


    /* ══════════════════════════════════════════════════════
       LISTA DE LOGS
       ══════════════════════════════════════════════════════
       Cada linha de log tem: hora | mensagem
       Cores diferentes por tipo:
       - success (verde): operação concluída com sucesso
       - error   (vermelho): algo falhou
       - warn    (laranja): aviso, mas não é um erro grave
       - info    (padrão): informação neutra
    */
    .log-list { display: flex; flex-direction: column; gap: 2px; }
    .log-row {
      display: flex;
      align-items: baseline; /* alinha pelo texto, não pelo centro do elemento */
      gap: .75rem;
      padding: .4rem .75rem;
      border-radius: var(--radius);
      background: var(--bg-card);
    }
    .log-time { font-family: 'Cinzel', serif; font-size: .65rem; color: var(--text-m); flex-shrink: 0; }
    .log-msg  { font-size: .82rem; color: var(--text-s); line-height: 1.4; }
    .log-success .log-msg { color: var(--green); }
    .log-error   .log-msg { color: var(--red); }
    .log-warn    .log-msg { color: var(--orange); }


    /* ══════════════════════════════════════════════════════
       ESTADO VAZIO (quando não há posts pendentes)
       ══════════════════════════════════════════════════════
       Em vez de mostrar nada, exibe uma mensagem amigável
       explicando o que fazer — evita confusão do usuário.
    */
    .empty       { text-align: center; padding: 3.5rem 1rem; }
    .empty-icon  { font-size: 2.8rem; margin-bottom: .75rem; }
    .empty-title { font-family: 'Cinzel', serif; font-size: 1rem; color: var(--text-s); margin-bottom: .4rem; }
    .empty-sub   { font-size: .84rem; color: var(--text-m); max-width: 340px; margin: 0 auto; line-height: 1.6; }


    /* ══════════════════════════════════════════════════════
       TOAST (notificação temporária)
       ══════════════════════════════════════════════════════
       Aparece na parte inferior da tela por 2,5 segundos
       para confirmar ações como "Post publicado!".

       POR QUE toast e não um alert()?
       → O alert() do browser é feio, bloqueia a página inteira
         e o usuário precisa clicar "OK". O toast aparece
         discretamente e some sozinho, sem interromper o trabalho.

       position:fixed + left:50% + transform:translateX(-50%)
       → Fixa o elemento na tela (não sobe com a rolagem)
         e centraliza horizontalmente, mesmo sem saber a largura exata.
    */

      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);

    /*

    .card-images {

    /* Etiqueta discreta de contagem de imagens */

    /*

      A borda muda de cor conforme o estado: cinza/roxo/dourado.

    .img-ctrl.star:hover       { color: var(--gold);   border-color: rgba(201,168,76,.4); }
    .img-ctrl:disabled         { opacity: .25; cursor: default; }

    /* Opções de posicionamento das imagens no artigo */

<body>

<!--
  ════════════════════════════════════════════════════════════════
  TELA DE LOGIN
  ════════════════════════════════════════════════════════════════
  Exibida quando a página abre. O painel principal fica escondido
  (display:none) até o login ser feito com sucesso.

  POR QUE não usar sessão do servidor para o login?
  → O site não tem servidor — é 100% estático (arquivos HTML).
    A "autenticação" aqui é feita comparando email/senha digitados
    com os valores hardcoded no JavaScript. É suficiente para
    proteger um painel de admin de um site pessoal/pequeno.
    Para um site com muitos usuários, precisaríamos de um backend.
  ════════════════════════════════════════════════════════════════
-->
<div id="authScreen">
  <div class="auth-box">
    <div class="auth-logo">🐉 DRAKANTOS</div>

         permite fazer login pressionando Enter, sem precisar clicar no botão -->

      onkeydown="if(event.key==='Enter') tryLogin()" />
    <input id="authPass" class="input" type="password" placeholder="Senha"
      onkeydown="if(event.key==='Enter') tryLogin()" />

</div>


<!--
  ════════════════════════════════════════════════════════════════
  PAINEL PRINCIPAL (fica escondido até o login)
  ════════════════════════════════════════════════════════════════
  style="display:none" → escondido por padrão.
  O JavaScript muda para display:flex após login bem-sucedido.
  ════════════════════════════════════════════════════════════════
-->
<div id="mainPanel" style="display:none; flex-direction:column; min-height:100vh">

  <!-- Cabeçalho: título do painel + pílula de status -->
  <header class="agent-header">
    <div class="agent-header-left">

        <!-- AppID 2454980 é o identificador do Drakantos na plataforma Steam -->

      </div>

      <!-- ▶ Iniciar / ⏹ Pausar: alterna o monitoramento automático -->

</div>


<script>
/*
  ════════════════════════════════════════════════════════════════
  CREDENCIAIS DO ADMINISTRADOR
  ════════════════════════════════════════════════════════════════
  POR QUE as credenciais estão aqui e não em um banco de dados?
  → O site não tem servidor nem banco de dados. Para um site
    com um único administrador, guardar as credenciais no JS
    é suficiente — contanto que o arquivo não seja publicamente
    linkado ou indexado pelo Google.

  ATENÇÃO: desde 24/10/2026 a senha não aparece mais no código-fonte
  (só um hash dela). Mesmo assim, a página roda toda no navegador.
  Por isso o arquivo NÃO está linkado em nenhuma página do site.
*/
/*
  SEGURANÇA (24/10/2026): a senha não fica mais escrita aqui. Guardamos
  só o hash PBKDF2 (o mesmo do backend.js). Para trocar a senha, gere
  novos valores com o comando descrito em hashPassword no backend.js e
  atualize os DOIS arquivos.
*/
const ADMIN = {
  email:     'ronancardoso22@hotmail.com',
  adminSalt: 'e9t02fLH28dmGkLxIgUx7Q==',
  adminHash: 'OGMKe+1f/OyB+IDXXXflGzLHk+LfwT+e2enVheg9oyk=',
};

// Calcula o hash PBKDF2-SHA256 (150 mil voltas) da senha digitada e compara
async function senhaAdminConfere(pass) {
  if (!window.crypto?.subtle) return false;
  const sal  = Uint8Array.from(atob(ADMIN.adminSalt), c => c.charCodeAt(0));
  const key  = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: sal, iterations: 150000 }, key, 256);
  const hash = btoa(String.fromCharCode(...new Uint8Array(bits)));
  let diff = hash.length ^ ADMIN.adminHash.length;
  for (let i = 0; i < hash.length; i++) diff |= hash.charCodeAt(i) ^ (ADMIN.adminHash.charCodeAt(i) || 0);
  return diff === 0;
}


/*
  ════════════════════════════════════════════════════════════════
  ESTADO GLOBAL DO AGENTE (objeto S)
  ════════════════════════════════════════════════════════════════
  POR QUE um único objeto "S" (de State)?
  → Centraliza todos os dados que o agente precisa lembrar
    enquanto a página está aberta. Se precisarmos saber
    "o agente está rodando?", consultamos S.running.
    Alternativa seria variáveis soltas, mas fica confuso rapidamente.

  Os dados em S vivem apenas na memória do browser (RAM).
  Quando a página fecha, S some. Por isso salvamos em
  localStorage/sessionStorage o que precisa persistir.
*/
const S = {
  workerUrl:    '',        // URL do Cloudflare Worker (para produção)
  apiKey:       '',        // chave da API Groq (para testes locais)
  pendingPosts: [],        // lista de posts gerados aguardando revisão
  seenGids:     new Set(), // IDs dos posts da Steam já processados (evita duplicatas)
  logs:         [],        // histórico de ações exibido na aba Logs
  running:      false,     // true = monitoramento automático ligado
  intervalMs:   1800000,   // intervalo entre verificações (padrão: 30 minutos em ms)
  countdown:    0,         // segundos restantes até a próxima verificação
  _timer:       null,      // referência ao setInterval do ciclo principal
  _cdTimer:     null,      // referência ao setInterval da contagem regressiva
  activeTab:    'posts',   // qual aba está visível: 'posts', 'config' ou 'logs'
};

/*
  Opções de intervalo disponíveis na aba Configurar.
  POR QUE um array de objetos em vez de valores soltos?
  → Facilita gerar os botões dinamicamente: basta percorrer
    o array com .map() e criar um botão para cada item.
    Adicionar uma nova opção é só adicionar uma linha aqui.
*/
const IVLS = [
  { label: '5 min',   ms: 300000   },
  { label: '15 min',  ms: 900000   },
  { label: '30 min',  ms: 1800000  },
  { label: '1 hora',  ms: 3600000  },
  { label: '6 horas', ms: 21600000 },
  { label: '12 horas',ms: 43200000 },
  { label: '24 horas',ms: 86400000 },
];


/*
  ════════════════════════════════════════════════════════════════
  FUNÇÃO DE LOGIN
  ════════════════════════════════════════════════════════════════
  Chamada quando o admin clica "Entrar" ou pressiona Enter.

  PASSO A PASSO:
  1. Lê o email e senha digitados nos campos
  2. Compara com as credenciais fixas (ADMIN)
  3. Se correto: inicializa o agente, esconde o login, mostra o painel
  4. Se errado: exibe mensagem de erro por 3 segundos
*/
async function tryLogin() {
  // .trim() remove espaços extras que o usuário possa ter digitado por acidente
  const email = document.getElementById('authEmail').value.trim();
  const pass  = document.getElementById('authPass').value;
  const err   = document.getElementById('authError');

  if (email === ADMIN.email && await senhaAdminConfere(pass)) {
    init(); // carrega dados salvos do localStorage
    document.getElementById('authScreen').style.display = 'none'; // esconde login
    document.getElementById('mainPanel').style.display  = 'flex'; // mostra painel
    render(); // desenha as abas e o conteúdo inicial
  } else {
    err.textContent = 'Credenciais inválidas.';
    // setTimeout: apaga a mensagem de erro automaticamente após 3000ms (3 segundos)
    setTimeout(() => err.textContent = '', 3000);
  }
}


/*
  ════════════════════════════════════════════════════════════════
  INICIALIZAÇÃO — carrega dados persistidos
  ════════════════════════════════════════════════════════════════
  Chamada uma vez após o login bem-sucedido.

  POR QUE usar try/catch aqui?
  → Se o localStorage tiver um valor corrompido (ex: texto inválido
    onde deveria haver JSON), JSON.parse() lança um erro e a página
    travaria. O try/catch faz o programa ignorar o erro e continuar
    com o valor padrão (array/Set vazios).

  POR QUE localStorage para seenGids e apiKey, mas sessionStorage para pendingPosts?
  → localStorage persiste para sempre (mesmo fechando o browser).
    sessionStorage persiste só enquanto a aba está aberta.
    - Posts vistos e chave API devem durar para sempre → localStorage
    - Posts pendentes fazem sentido apenas na sessão atual → sessionStorage
      (se o admin fechar sem publicar, na próxima sessão busca novamente)
*/
function init() {
  // Carrega os IDs de posts já vistos (converte array JSON para Set)
  try { S.seenGids = new Set(JSON.parse(localStorage.getItem('drk_agent_seen') || '[]')); } catch {}
  // Carrega posts pendentes da sessão atual
  try { S.pendingPosts = JSON.parse(sessionStorage.getItem('drk_agent_pending') || '[]'); } catch {}
  // Carrega configurações salvas
  S.workerUrl = localStorage.getItem('drk_agent_worker') || '';
  S.apiKey    = localStorage.getItem('drk_agent_key')    || '';
}


/*
  ════════════════════════════════════════════════════════════════
  FUNÇÕES DE ACESSO AO ARMAZENAMENTO LOCAL
  ════════════════════════════════════════════════════════════════
  O localStorage funciona como um "caderno" do browser onde
  guardamos dados em formato texto. JSON.stringify converte
  objetos JavaScript para texto, e JSON.parse faz o inverso.

  POR QUE funções separadas para cada operação?
  → Evita repetição: em vez de escrever JSON.parse(localStorage...)
    em 10 lugares diferentes, chama getPosts() em todos.
    Se o formato mudar, atualiza em um só lugar.
*/
function getPosts()       { try { return JSON.parse(localStorage.getItem('drk_posts') || '[]'); } catch { return []; } }
function savePosts(posts) { localStorage.setItem('drk_posts', JSON.stringify(posts)); }
// [...S.seenGids] converte o Set para array antes de salvar (Set não é serializável em JSON)
function saveSeen()       { localStorage.setItem('drk_agent_seen', JSON.stringify([...S.seenGids])); }
function savePending()    { sessionStorage.setItem('drk_agent_pending', JSON.stringify(S.pendingPosts)); }


/*
  ════════════════════════════════════════════════════════════════
  SISTEMA DE LOGS
  ════════════════════════════════════════════════════════════════
  Registra cada ação do agente com horário e tipo (info/success/error/warn).
  O admin pode ver o histórico completo na aba "Logs".

  POR QUE unshift() em vez de push()?
  → unshift() adiciona no INÍCIO do array, então os logs mais
    recentes ficam no topo da lista — mais fácil de ver.
    push() adicionaria no fim e o admin precisaria rolar para baixo.

  POR QUE limitar a 100 logs?
  → Sem limite, o array cresceria indefinidamente consumindo memória.
    100 entradas são mais que suficientes para diagnosticar problemas.
*/
function addLog(msg, type = 'info') {
  S.logs.unshift({ msg, type, time: new Date().toLocaleTimeString('pt-BR'), id: Date.now() });
  if (S.logs.length > 100) S.logs.length = 100; // descarta os mais antigos
  if (S.activeTab === 'logs') renderContent();   // atualiza a tela se a aba Logs estiver aberta
  updateTabLabels();                             // atualiza o contador "Logs (X)"
}


/*
  ════════════════════════════════════════════════════════════════
  BUSCA DE NOTÍCIAS DA STEAM
  ════════════════════════════════════════════════════════════════
  POR QUE precisamos de um PROXY (allorigins.win)?
  → O browser bloqueia requisições de um site para outro por
    segurança (política CORS). A API da Steam não permite
    ser acessada diretamente de páginas web.
    O allorigins.win é um intermediário: nossa página pede para
    ele buscar a Steam, e ele nos repassa o resultado.

  POR QUE não chamar a Steam diretamente?
  → Daria erro: "Access-Control-Allow-Origin header missing".
    O proxy resolve esse problema sem precisar de servidor próprio.
*/
/*
  Lista de proxies CORS, usados em sequência (fallback automático).
  POR QUE precisamos de proxy?
  → O browser bloqueia por segurança qualquer requisição a um domínio
    diferente do da página atual (política CORS). A API da Steam não
    permite acesso direto de páginas web, então usamos um intermediário
    que busca o conteúdo e nos devolve com os headers CORS corretos.

  POR QUE vários proxies em vez de um?
  → Serviços gratuitos de proxy podem ficar fora do ar ou lentos.
    Com uma lista, tentamos o primeiro e, se falhar, tentamos o próximo
    automaticamente — o agente fica mais robusto sem intervenção manual.

  FORMATOS:
  - corsproxy.io  → retorna a resposta direta (res.json())
  - allorigins /raw → retorna a resposta direta (res.json())
  - allorigins /get → retorna { contents: "..." } → precisa de JSON.parse(outer.contents)
  Todos os proxies desta lista retornam a resposta direta para simplificar.
*/
const PROXIES = [
  /*
    1º) SERVIDOR LOCAL (servidor_agente.py): mesmo endereço da página, então
        não existe bloqueio de CORS e não depende de serviço de terceiros.
        Só funciona quando o agent.html é aberto por http://localhost:8000.
  */
  ...(location.protocol.startsWith('http') ? ['/api/proxy?url='] : []),
  // 2º) Proxies públicos gratuitos (podem cair ou bloquear a qualquer momento)
  'https://api.codetabs.com/v1/proxy?quest=',
  'https://api.allorigins.win/raw?url=',
  'https://corsproxy.io/?url=',
  'https://api.cors.lol/?url=',
];

/*
  Busca uma URL passando pelos proxies, um de cada vez, com limite de tempo.
  POR QUE limite de tempo? → Um proxy fora do ar deixava o agente travado
  por quase 20 segundos antes de tentar o próximo.
*/
async function fetchViaProxy(targetUrl, { asText = false, log = true } = {}) {
  let lastError = null;
  for (const proxy of PROXIES) {
    const ctrl  = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 10000);
    try {
      const res = await fetch(proxy + encodeURIComponent(targetUrl), { signal: ctrl.signal });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return asText ? await res.text() : await res.json();
    } catch (e) {
      lastError = e.name === 'AbortError' ? new Error('demorou demais') : e;
      const nome = proxy.startsWith('/') ? 'servidor local' : proxy.split('/')[2];
      if (log) addLog(`⚠️ Proxy falhou (${nome}): ${lastError.message}`, 'warn');
    } finally {
      clearTimeout(timer);
    }
  }
  throw new Error('Todos os proxies falharam. Último: ' + lastError?.message
    + '. Dica: rode o servidor_agente.py e abra http://localhost:8000/agent.html');
}
/*
  maxlength=0 → retorna o conteúdo completo sem corte.
  POR QUE 0 e não 3000?
  → Com 3000 o Steam truncava o BBCode antes de chegar nas imagens.
    Com 0, recebemos o artigo inteiro, incluindo todas as tags [img].
*/
const STEAM_URL = 'https://api.steampowered.com/ISteamNews/GetNewsForApp/v2/?appid=2454980&count=10&maxlength=0&format=json';

/*
  Remove formatação BBCode do texto da Steam.
  BBCode é um sistema de formatação como [b]negrito[/b], [url=...]link[/url].
  A Steam usa isso nos posts, mas nós queremos texto puro para a IA processar.

  Cada .replace() remove um tipo de tag:
  - [h1]/[h2]/[h3] → títulos (remove a tag, mantém texto com quebra de linha)
  - [b]texto[/b]   → negrito (remove as tags, mantém o texto)
  - [url=...]...[/url] → links (mantém só o texto visível)
  - [img]...[/img] → imagens (remove tudo, incluindo a URL)
  - [*]            → marcador de lista → substitui por "• "
  - \n{3,}         → 3+ quebras de linha consecutivas → reduz para 2
*/
function stripBB(text = '') {
  return text
    .replace(/\[h[1-3]\]/gi,'').replace(/\[\/h[1-3]\]/gi,'\n')
    .replace(/\[b\](.*?)\[\/b\]/gi,'$1').replace(/\[i\](.*?)\[\/i\]/gi,'$1')
    .replace(/\[url=.*?\](.*?)\[\/url\]/gi,'$1').replace(/\[img\].*?\[\/img\]/gi,'')
    .replace(/\[\*\]/gi,'• ').replace(/\[.*?\]/g,'')
    .replace(/\n{3,}/g,'\n\n').trim();
}

/*
  Extrai URLs de imagens do BBCode da Steam antes de limpar o texto.
  POR QUE extrair ANTES do stripBB?
  → stripBB remove as tags [img]...[/img] completamente. Se extrairmos
    depois, as URLs já terão sido apagadas e não teremos como recuperá-las.

  FORMATO REAL DO STEAM:
  O Steam usa {STEAM_CLAN_IMAGE} como placeholder nas URLs de imagem:
    [img]{STEAM_CLAN_IMAGE}/38390428/abc.jpg[/img]
  Esse placeholder é substituído pelo cliente Steam por:
    https://clan.akamai.steamstatic.com/images/
  A versão anterior da regex só capturava URLs que começam com "http",
  por isso nunca encontrava nada — o conteúdo real usa o placeholder.

  FILTRO FINAL:
  Imagens menores que 10px ou com "icon"/"avatar" no nome são descartadas
  pois são elementos de UI, não imagens do artigo.
*/
const STEAM_CLAN_BASE = 'https://clan.akamai.steamstatic.com/images/';

function extractImages(text = '') {
  if (!text) return [];

  // Substitui o placeholder pelo CDN real antes de procurar as URLs
  const resolved = text.replace(/\{STEAM_CLAN_IMAGE\}/g, STEAM_CLAN_BASE);

  const seen   = new Set();
  const images = [];

  // Captura [img]URL[/img] — agora com URLs absolutas após resolver o placeholder
  const regex = /\[img\](https?:\/\/[^\[\]\s]+?)\[\/img\]/gi;
  let match;
  while ((match = regex.exec(resolved)) !== null) {
    // Normaliza barras duplas após o protocolo (ex: images//38390428 → images/38390428)
    const url = match[1].trim().replace(/([^:])\/\//g, '$1/');
    // Descarta ícones pequenos e avatares — não são imagens do artigo
    // SEGURANÇA: só https e sem aspas/< >/crase/barra invertida, para a URL
    // nunca conseguir "fugir" do atributo src ou do onclick onde é usada
    if (!/^https:\/\/[^\s"'<>`\\]+$/.test(url)) continue;
    if (!seen.has(url) && !/icon|avatar|1x1/i.test(url)) {
      seen.add(url);
      images.push(url);
    }
  }
  return images;
}

/*
  Busca imagens diretamente na página HTML do post da Steam.
  Usado como complemento quando o BBCode não tem tags [img].

  POR QUE buscar na página HTML e não só no BBCode?
  → Alguns posts da Steam exibem as imagens apenas no HTML da página web,
    sem incluir [img] no conteúdo da API. Buscar o HTML garante que
    capturamos essas imagens também.

  FILTRO:
  Só aceita imagens do CDN da Steam (steamstatic, steamusercontent, akamaihd)
  e descarta elementos de UI (avatares, ícones, botões, imagens 1x1).
*/
async function fetchPageImages(pageUrl) {
  try {
    const html    = await fetchViaProxy(pageUrl, { asText: true, log: false });
    const seen    = new Set();
    const images  = [];

    // Procura qualquer src="..." que aponte para o CDN da Steam
    const imgRx = /src=["'](https?:\/\/[^"']*(?:steamstatic|steamusercontent|akamaihd)[^"']*\.(?:jpg|jpeg|png|gif|webp)(?:\?[^"']*)?)/gi;
    let m;
    while ((m = imgRx.exec(html)) !== null) {
      const url = m[1];
      if (/[\s<>`\\]/.test(url)) continue; // SEGURANÇA: descarta URLs com caracteres perigosos
      if (!seen.has(url) && !/icon|avatar|1x1|button|logo/i.test(url)) {
        seen.add(url);
        images.push(url);
      }
    }
    // Retorna no máximo 8 imagens para não sobrecarregar o post
    return images.slice(0, 8);
  } catch (_) {
    return []; // sem imagens extras da página; segue só com as do BBCode
  }
}


/*
  Busca as últimas notícias do Drakantos na Steam, tentando cada proxy em sequência.
  POR QUE um loop pelos proxies em vez de chamar um fixo?
  → Se o primeiro proxy falhar (fora do ar, bloqueado, timeout), o loop
    tenta o próximo automaticamente. O admin não precisa fazer nada.
    Só lança erro se TODOS os proxies falharem.

  encodeURIComponent() → converte a URL da Steam para um formato
  seguro para passar como parâmetro (substitui ":" por "%3A", etc.)
*/
async function fetchSteam() {
  const data = await fetchViaProxy(STEAM_URL);
  return data?.appnews?.newsitems || [];
}


/*
  ════════════════════════════════════════════════════════════════
  GERAÇÃO DE POSTS COM IA (Groq API)
  ════════════════════════════════════════════════════════════════
  Esta é a função principal do agente. Recebe uma notícia da Steam
  e usa a IA para transformá-la em um post editorial em português.

  POR QUE Groq e não ChatGPT ou outro?
  → Groq oferece um plano gratuito generoso (14.400 req/dia)
    sem necessidade de cartão de crédito. Para o volume baixo
    deste agente (poucos posts por dia), é mais que suficiente.

  POR QUE limitar o conteúdo a 2000 caracteres (clean.slice(0, 2000))?
  → APIs de IA cobram por quantidade de texto processado (tokens).
    Enviar o texto completo pode ser desnecessário e mais caro.
    Os primeiros 2000 caracteres geralmente capturam o essencial.

  COMO FUNCIONA:
  1. Limpa o texto BBCode da Steam
  2. Monta um "prompt" (instrução) detalhado para a IA
  3. Envia para a Groq via API
  4. Recebe o texto gerado e extrai cada campo (título, resumo, etc.)
  5. Retorna um objeto estruturado pronto para exibir no card
*/
/*
  ════════════════════════════════════════════════════════════════
  AJUDANTES DE TRADUÇÃO (correção do texto meio inglês, meio português)
  ════════════════════════════════════════════════════════════════
*/
const SYSTEM_PTBR = `Você é tradutor e redator de um site brasileiro sobre o jogo Drakantos.
Responda SEMPRE e SOMENTE em português brasileiro. Nenhuma frase, subtítulo ou item de lista pode ficar em inglês.
Mantenha em inglês apenas nomes próprios (Drakantos, nomes de personagens, lugares, itens, habilidades) e siglas como PvP, PvE, XP, DPS, MMO.
Siga exatamente o formato de campos pedido, sem negrito (**), sem títulos com # e sem comentários extras.`;

// Palavras muito comuns em inglês e em português, usadas para detectar o idioma.
const EN_WORDS = new Set('the and with will you your new update fixed added removed now from this that have has for are is was were which when where our we it its been can more players player some all into than these those there their they them should would could also only just about after before during while what how here'.split(' '));
const PT_WORDS = new Set('o a os as um uma de do da dos das em no na nos nas para por com que não é são foi foram mais seu sua seus suas também agora novo nova novos novas jogadores jogador'.split(' '));

/*
  Diz se um texto ainda tem inglês.
  Olha frase por frase: basta UMA frase claramente em inglês para acusar.
  POR QUE frase por frase? → O problema era justamente o texto misturado:
  no geral parece português, mas um parágrafo inteiro ficava em inglês.
*/
function temIngles(texto = '') {
  const frases = texto.split(/(?<=[.!?])\s+|\n+/);
  return frases.some(f => {
    const w = f.toLowerCase().match(/[a-zà-ú']+/g) || [];
    if (w.length < 4) return false;
    const en = w.filter(x => EN_WORDS.has(x)).length;
    const pt = w.filter(x => PT_WORDS.has(x)).length;
    return en >= 2 && en > pt;
  });
}

/*
  Extrai os campos da resposta da IA de forma tolerante:
  aceita "TITULO:", "Título:", "**TITULO:**", "## TÍTULO:" etc.
  POR QUE? → Quando a IA formatava diferente, a extração antiga falhava
  e o código usava o texto original EM INGLÊS no lugar.
*/
function parseFields(raw = '') {
  const norm = raw
    .replace(/\*\*/g, '')
    .replace(/^#+\s*/gm, '')
    .replace(/^(t[íi]tulo|subt[íi]tulo|categoria|emoji|resumo|corpo)\s*:/gim,
      (_, k) => k.toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '') + ':');
  const keys = ['TITULO', 'SUBTITULO', 'CATEGORIA', 'EMOJI', 'RESUMO', 'CORPO'];
  const out = {};
  for (const k of keys) {
    const m = norm.match(new RegExp('^' + k + ':[ \\t]*([\\s\\S]*?)(?=^(?:' + keys.join('|') + '):|$(?![\\s\\S]))', 'm'));
    out[k] = m ? m[1].trim() : '';
  }
  return out;
}

/*
  Chama a IA (Groq direto ou pelo Worker) e devolve o texto gerado.
  Reaproveitada na geração e na revisão da tradução.
*/
async function callGroq(messages, maxTokens = 4000) {
  const body = JSON.stringify({
    model:       'llama-3.3-70b-versatile',
    max_tokens:  maxTokens,
    temperature: 0.3,
    messages,
  });
  const url     = S.apiKey ? 'https://api.groq.com/openai/v1/chat/completions' : S.workerUrl;
  const headers = { 'Content-Type': 'application/json' };
  if (S.apiKey) headers['Authorization'] = 'Bearer ' + S.apiKey;

  const res = await fetch(url, { method: 'POST', headers, body });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || (S.apiKey ? 'Erro Groq: ' : 'Erro Worker: ') + res.status);
  }
  const data = await res.json();
  return data.choices?.[0]?.message?.content || '';
}

async function generatePost(item) {
  // Verifica se há alguma forma de chamar a IA antes de tentar
  if (!S.apiKey && !S.workerUrl) throw new Error('Configure a Chave API Groq ou a URL do Worker.');

  /*
    COLETA DE IMAGENS — duas fontes combinadas:
    1. BBCode da API: [img]{STEAM_CLAN_IMAGE}/xxx.jpg[/img]
       Rápido, mas alguns posts não incluem [img] no conteúdo da API.
    2. HTML da página web do post: busca <img src="..."> no CDN da Steam.
       Mais lento (requer uma requisição extra), mas garante as imagens
       quando o BBCode não as inclui.
    As listas são mescladas sem duplicatas; o BBCode tem prioridade
    (imagens inline são mais relevantes que imagens decorativas da página).
  */
  const bbImages   = extractImages(item.contents);
  const pageImages = await fetchPageImages(item.url);
  // Une as duas listas sem repetir a mesma URL
  const images = [...new Set([...bbImages, ...pageImages])];

  if (images.length > 0) {
    addLog(`🖼️ ${images.length} imagem(ns) encontrada(s) para "${item.title}"`, 'info');
  }

  const clean   = stripBB(item.contents); // remove BBCode (incluindo as tags [img], mas as URLs já foram salvas)
  // item.date é um timestamp Unix (segundos desde 1970) — multiplica por 1000 para converter para ms
  const dateStr = new Date(item.date * 1000).toLocaleString('pt-BR');

  /*
    O prompt é uma instrução detalhada para a IA.
    POR QUE especificar um formato exato (TITULO:, SUBTITULO:, etc.)?
    → Para poder extrair cada parte do texto gerado com precisão.
      Se a IA responder livremente, não saberíamos onde termina
      o título e começa o resumo. O formato fixo permite usar
      expressões regulares (regex) para separar cada campo.

    POR QUE as instruções de tradução são tão explícitas?
    → O conteúdo da Steam vem em inglês. Sem instruções claras,
      modelos de IA tendem a "misturar" inglês e português ou
      traduzir de forma incompleta — principalmente em textos
      com muitos termos técnicos de jogos. Ser direto e repetitivo
      nas instruções de idioma melhora significativamente o resultado.
  */
  const prompt = `Você é o editor e tradutor oficial do site de fãs Drakantos — um MMORPG pixel art free-to-play.

TAREFA: Traduzir e transformar o devlog/notícia abaixo (escrito em INGLÊS) em um post editorial completo em PORTUGUÊS BRASILEIRO (PT-BR).

REGRAS OBRIGATÓRIAS:
1. TODO o texto gerado deve estar em português brasileiro — sem exceções.
2. Nomes próprios do jogo (personagens, lugares, habilidades, itens) podem ser mantidos em inglês SE não houver tradução consagrada.
3. Termos técnicos de jogos devem ser traduzidos quando houver equivalente natural em PT-BR (ex: "update" → "atualização", "patch" → "versão", "content" → "conteúdo").
4. O tom deve ser entusiasmado e jornalístico — como uma revista de jogos brasileira.
5. NÃO use frases em inglês no meio do texto. Se não souber traduzir algo, parafraseie.

TÍTULO ORIGINAL (inglês): ${item.title}
DATA: ${dateStr}
CONTEÚDO ORIGINAL (inglês):
${clean.slice(0, 2500)}

Gere a resposta EXATAMENTE neste formato (todos os campos em português):

TITULO: (título impactante em PT-BR, máx 80 caracteres)
SUBTITULO: (complementa o título, máx 120 caracteres)
CATEGORIA: (uma de: ATUALIZAÇÃO | EVENTO | NOTÍCIAS)
EMOJI: (um único emoji representativo)
RESUMO: (APENAS 1 frase de até 120 caracteres. Funciona como gancho/teaser — desperta curiosidade sem revelar os detalhes. NÃO explique o que aconteceu; faça o leitor querer clicar para saber mais. Exemplo bom: "Uma mudança silenciosa pode transformar a forma como você joga Drakantos para sempre." Exemplo ruim: "A atualização 2.3 adicionou 5 dungeons, novos itens e melhorias no sistema de craft.")
CORPO:
(Post completo em PT-BR com TODOS os detalhes, contexto e análise — tudo que ficou de fora do resumo vai aqui. 4-6 parágrafos bem desenvolvidos, linguagem entusiasmada mas jornalística. O corpo deve ser suficientemente completo para que o leitor não precise visitar a fonte original. 100% em português — qualquer palavra em inglês desnecessária é um erro.${images.length > 0 ? ` IMPORTANTE: neste campo, insira o marcador [IMAGEM] em uma linha própria (sozinho, sem mais texto na mesma linha) em até ${Math.min(images.length, 5)} posições onde uma imagem seria contextualmente relevante — por exemplo, logo após descrever uma nova feature, sistema ou cena que provavelmente tem uma screenshot. Coloque o marcador ENTRE parágrafos, nunca no meio de uma frase. Se não houver contexto visual claro para várias imagens, use apenas 1 marcador.` : ''})`;


  /*
    CORREÇÃO DO TEXTO MISTURADO (inglês + português):
    → Mensagem de sistema fixa com a regra de idioma (o modelo dá mais peso a ela).
    → temperature baixa: o modelo "inventa" menos e segue melhor as regras.
    → max_tokens maior: com 2000 o CORPO às vezes era cortado no meio.
  */
  let raw = await callGroq([
    { role: 'system', content: SYSTEM_PTBR },
    { role: 'user',   content: prompt },
  ], 4000);

  /*
    Não reaproveitamos mais o texto original da Steam quando a IA esquece um campo.
    Antes: extract('TITULO') || item.title → colocava o título EM INGLÊS no post.
  */
  let fields = parseFields(raw);

  /*
    VERIFICAÇÃO DE IDIOMA: se ainda sobrou inglês em algum campo,
    pede para a IA revisar o próprio texto e reescrever tudo em PT-BR.
  */
  const camposEmIngles = () => ['TITULO', 'SUBTITULO', 'RESUMO', 'CORPO']
    .filter(k => fields[k] && temIngles(fields[k]));

  if (!fields.TITULO || !fields.CORPO || camposEmIngles().length > 0) {
    addLog(`🔁 Revisando tradução de "${item.title}" (sobrou inglês ou faltou campo)...`, 'warn');
    const revisado = await callGroq([
      { role: 'system', content: SYSTEM_PTBR },
      { role: 'user',   content: prompt },
      { role: 'assistant', content: raw },
      { role: 'user',   content: `Revise sua resposta acima. Ela ainda tem trechos em inglês ou campos faltando. Reescreva a resposta INTEIRA, no mesmo formato (TITULO:, SUBTITULO:, CATEGORIA:, EMOJI:, RESUMO:, CORPO:), com TODAS as frases em português brasileiro. Mantenha os marcadores [IMAGEM] onde estão. Não escreva nada além da resposta.` },
    ], 4000);
    const novos = parseFields(revisado);
    if (novos.TITULO && novos.CORPO) { raw = revisado; fields = novos; }
  }

  const aindaIngles = camposEmIngles();
  if (aindaIngles.length > 0) {
    addLog(`⚠️ "${item.title}": ainda pode ter inglês em ${aindaIngles.join(', ')}. Revise antes de publicar.`, 'warn');
  }
  const extract = k => fields[k] || '';



  // Valida a categoria — se a IA inventar algo diferente, usa 'NOTÍCIAS' como fallback
  const cat       = extract('CATEGORIA').toUpperCase();
  const validTags = ['ATUALIZAÇÃO', 'EVENTO', 'NOTÍCIAS'];
  const tag       = validTags.includes(cat) ? cat : 'NOTÍCIAS';

  // Retorna o post estruturado pronto para exibir no card e eventualmente publicar
  return {
    _id:           'agent-' + item.gid,   // ID interno do agente (não vai para o site)
    steamGid:      item.gid,              // ID único do post na Steam (para evitar duplicatas)
    steamUrl:      item.url,              // link para o post original na Steam
    steamDate:     dateStr,              // data formatada em português
    originalTitle: item.title,           // título original em inglês (para referência)
    title:         extract('TITULO')    || '(Revisar: título não gerado)', // nunca usa o título em inglês
    subtitle:      extract('SUBTITULO'),                  // subtítulo complementar
    emoji:         extract('EMOJI')     || '📰',          // emoji representativo
    tags:          [tag],                                 // categoria validada
    desc: (() => {
      // Extrai o RESUMO gerado pela IA; fallback: o subtítulo (nunca o texto em inglês)
      const raw = extract('RESUMO') || extract('SUBTITULO') || '';
      // Garante no código que não ultrapassa 150 chars, independente do que a IA gerou
      return raw.length > 150 ? raw.slice(0, 147) + '...' : raw;
    })(),                                                       // texto do card de preview
    body:          extract('CORPO')     || '',            // nunca usa o texto em inglês da Steam
    generatedAt:     new Date().toLocaleString('pt-BR'),
    editing:         false,
    images:          images,          // todas as imagens encontradas (pool completo)
    selectedImages:  [...images],     // quais irão para o post (começa com todas selecionadas)
    coverImage:      images[0] || null, // qual será a capa do card (começa com a primeira)
    imgPlacement:    'gallery',       // 'gallery' = galeria ao final | 'split' = intercaladas no texto
    langWarning:     aindaIngles.length > 0, // true = a verificação ainda achou inglês
  };
}


/*
  ════════════════════════════════════════════════════════════════
  CICLO PRINCIPAL — executa uma rodada de busca e geração
  ════════════════════════════════════════════════════════════════
  Chamado manualmente (botão "Buscar Agora") ou automaticamente
  pelo setInterval quando o monitoramento está ligado.

  PASSO A PASSO:
  1. Desabilita o botão "Buscar Agora" (evita cliques duplos)
  2. Busca as últimas notícias da Steam
  3. Filtra apenas as notícias ainda não processadas
  4. Para cada notícia nova (máx 3 por vez):
     a. Gera o post com a IA
     b. Adiciona à lista de pendentes
     c. Marca o gid como visto
     d. Salva tudo
  5. Reabilita o botão
*/
async function runCycle() {
  setBusy(true);
  addLog('📡 Buscando novidades da Steam...', 'info');

  let items;
  try { items = await fetchSteam(); }
  catch (e) { addLog('❌ Erro Steam: ' + e.message, 'error'); setBusy(false); return; }

  // Filtra apenas itens cujo gid (ID) não está no conjunto de "já vistos"
  const newItems = items.filter(i => !S.seenGids.has(i.gid));
  if (newItems.length === 0) {
    addLog('✓ Nenhuma novidade nova encontrada.', 'info');
    setBusy(false);
    return;
  }

  addLog(`🆕 ${newItems.length} novidade(s) nova(s) encontrada(s)!`, 'success');

  /*
    Processa no máximo 3 itens por ciclo.
    POR QUE limitar a 3?
    → Cada geração é uma chamada à API. Processar 10 de uma vez
      seria lento e poderia atingir limites de requisição.
      3 é um equilíbrio entre velocidade e volume.
  */
  for (const item of newItems.slice(0, 3)) {
    addLog(`✍ Gerando: "${item.title}"`, 'info');
    try {
      const post = await generatePost(item);
      S.pendingPosts.unshift(post);  // adiciona no início (post mais novo no topo)
      S.seenGids.add(item.gid);      // marca como visto para não processar de novo
      saveSeen();
      savePending();
      addLog(`✅ Gerado: "${post.title}"`, 'success');
      if (S.activeTab === 'posts') renderContent(); // atualiza a lista na tela
      updateTabLabels();
    } catch (e) {
      // Se um post falhar, registra o erro mas continua os próximos
      addLog(`❌ Erro "${item.title}": ${e.message}`, 'error');
    }
  }

  if (S.activeTab === 'posts') renderContent();
  setBusy(false);
}

/*
  Desabilita/habilita o botão "Buscar Agora" durante o processamento.
  POR QUE desabilitar?
  → Evita que o admin clique duas vezes e inicie dois ciclos simultâneos,
    o que geraria posts duplicados.
*/
function setBusy(busy) {
  const btn = document.getElementById('cycleBtn');
  if (btn) btn.disabled = busy || S.running; // também fica desabilitado quando está monitorando
}


/*
  ════════════════════════════════════════════════════════════════
  CONTROLE DO MONITORAMENTO AUTOMÁTICO
  ════════════════════════════════════════════════════════════════
  toggle() alterna entre ligar e desligar o monitoramento.

  POR QUE setInterval e não um loop com while(true) e sleep()?
  → setInterval agenda uma função para rodar repetidamente sem
    bloquear o browser. Um while(true) travaria a página inteira
    porque o JavaScript é single-threaded (uma coisa por vez).

  POR QUE dois setInterval (_timer e _cdTimer)?
  → _timer: executa o ciclo completo (busca + geração) no intervalo configurado
  → _cdTimer: atualiza a contagem regressiva na tela a cada 1 segundo
    São tarefas diferentes com frequências diferentes.
*/
function toggle() {
  if (S.running) {
    // ── DESLIGAR monitoramento ──
    S.running = false;
    clearInterval(S._timer);    // cancela o ciclo automático
    clearInterval(S._cdTimer);  // cancela a contagem regressiva
    S._timer = S._cdTimer = null;
    S.countdown = 0;
    addLog('🔴 Monitoramento pausado.', 'info');
    updateStatus();
    updateToggleBtn();
    document.getElementById('cycleBtn').disabled = false; // reabilita busca manual

  } else {
    // ── LIGAR monitoramento ──
    S.running = true;
    addLog('🟢 Monitoramento iniciado.', 'success');
    runCycle(); // executa imediatamente (não espera o primeiro intervalo)
    S._timer = setInterval(runCycle, S.intervalMs); // agenda ciclos futuros

    // Contagem regressiva: decrementa 1 segundo por vez, reinicia ao chegar a 0
    let secs = S.intervalMs / 1000;
    S.countdown = secs;
    S._cdTimer = setInterval(() => {
      secs = secs > 1 ? secs - 1 : S.intervalMs / 1000; // reinicia ao chegar a 1
      S.countdown = secs;
      const el = document.getElementById('statusText');
      if (el) el.textContent = 'próx. ' + fmtTime(secs); // atualiza o texto na tela
    }, 1000); // roda a cada 1000ms = 1 segundo

    updateStatus();
    updateToggleBtn();
    document.getElementById('cycleBtn').disabled = true; // desabilita busca manual durante monitoramento
  }
}

/*
  Muda o intervalo de verificação em tempo real.
  Se o monitoramento estiver ativo, reinicia o timer com o novo intervalo.
  POR QUE clearInterval + novo setInterval?
  → Não há como "redefinir" um setInterval existente. É preciso cancelar
    o antigo e criar um novo com o novo valor.
*/
function setIvl(ms) {
  S.intervalMs = ms;
  if (S.running) {
    clearInterval(S._timer);
    S._timer = setInterval(runCycle, ms);
    S.countdown = ms / 1000;
  }
  // Atualiza o visual dos botões (o selecionado fica destacado)
  document.querySelectorAll('.ivl-btn').forEach(b =>
    b.classList.toggle('active', parseInt(b.dataset.ms) === ms));
}

/*
  Formata segundos em texto legível: "2m 45s" ou "38s".
  POR QUE Math.floor?
  → Math.floor arredonda para baixo. Sem ele, 90.7 segundos
    ficaria "1m 30.7s" — o decimal é desnecessário aqui.
*/
function fmtTime(s) {
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return m > 0 ? `${m}m ${sec}s` : `${sec}s`;
}

/* Atualiza a pílula de status no cabeçalho (verde/pulsando quando ativo) */
function updateStatus() {
  const pill = document.getElementById('statusPill');
  const dot  = document.getElementById('statusDot');
  const txt  = document.getElementById('statusText');
  if (!pill) return;
  pill.classList.toggle('running', S.running); // adiciona/remove classe CSS 'running'
  dot.classList.toggle('active',  S.running);
  txt.textContent = S.running ? 'próx. ' + fmtTime(S.countdown) : 'inativo';
}

/* Muda o botão entre "▶ Iniciar" (roxo) e "⏹ Pausar" (vermelho) */
function updateToggleBtn() {
  const btn = document.getElementById('toggleBtn');
  if (!btn) return;
  btn.textContent = S.running ? '⏹ Pausar' : '▶ Iniciar';
  btn.className   = 'btn btn-sm ' + (S.running ? 'btn-danger' : 'btn-primary');
}


/*
  ════════════════════════════════════════════════════════════════
  PUBLICAR, EDITAR E DELETAR POSTS PENDENTES
  ════════════════════════════════════════════════════════════════
*/

/*
  Publica um post pendente no site principal.
  POR QUE escrever no localStorage em vez de chamar uma API?
  → O site não tem servidor. O site principal e o agente compartilham
    o mesmo localStorage do browser (mesma origem/domínio).
    Escrever em 'drk_posts' é como entregar o post diretamente ao site.

  PASSO A PASSO:
  1. Pega o post pendente pelo índice (posição na lista)
  2. Cria um objeto no formato que o site espera
  3. Adiciona no início da lista de posts do site (aparece primeiro)
  4. Remove da lista de pendentes
  5. Salva tudo e atualiza a tela
*/
function publishPost(idx) {
  const p = S.pendingPosts[idx];
  if (!p) return; // segurança: cancela se o índice não existir

  // Formata a data atual em português: "17 de maio de 2026"
  const dateStr = new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });

  const newPost = {
    id:        'post-' + Date.now(),  // ID único baseado no timestamp atual
    type:      'novidades',            // categoria no site (nova notícia)
    title:     p.title,
    desc:      p.desc,
    emoji:     p.emoji || '📰',
    tags:      p.tags  || ['NOTÍCIAS'],
    author:    'Administrador',
    authorId:  'admin',
    date:      dateStr,
    timestamp: Date.now(),             // número de ms desde 1970 (para ordenação)
    /*
      cardImage: imagem escolhida como capa no gerenciador (coverImage).
      O site renderiza cardImage como src de <img> — URLs da Steam funcionam.
      Fallback null → o site usa o emoji como thumbnail.
    */
    cardImage: p.coverImage || (p.selectedImages && p.selectedImages[0]) || null,

    /*
      Monta as seções de acordo com o modo de posicionamento escolhido:

      'gallery' (padrão): uma única seção com todo o texto; imagens ao final em grade.

      'split': divide o corpo em 2 partes e distribui as imagens entre elas.
        - Parte 1: primeira metade do texto + primeira metade das imagens
        - Parte 2: segunda metade do texto + segunda metade das imagens
      Isso cria um artigo mais visual, parecido com uma matéria de revista.

      POR QUE só 2 partes e não uma por parágrafo?
      → O site exibe o nome de cada seção como título (ex: "◆ Artigo Completo").
        Muitas seções criariam muitos títulos e fragmentariam demais o texto.
        Duas partes é um equilíbrio entre visual e legibilidade.
    */
    sections: (() => {
      const selImgs  = p.selectedImages && p.selectedImages.length > 0
                       ? p.selectedImages : (p.images || []);
      const bodyText = p.body || '';

      if (!bodyText && selImgs.length === 0) return [];

      if (p.imgPlacement === 'split' && bodyText) {
        /*
          SISTEMA DE MARCADORES [IMAGEM]:
          A IA insere o token "[IMAGEM]" em linha própria dentro do CORPO nos pontos
          onde uma imagem seria contextualmente relevante (ex: após descrever uma feature
          que provavelmente tem screenshot).

          Aqui dividimos o texto nesses marcadores e associamos uma imagem a cada parte.
          Isso garante que "a imagem das caixas fica perto do parágrafo que fala das caixas".

          POR QUE split com regex case-insensitive?
          → A IA às vezes gera [imagem] em minúsculas; regex /gi cobre todos os casos.
        */
        const parts = bodyText.split(/\[IMAGEM\]/gi).map(s => s.trim()).filter(Boolean);

        if (parts.length > 1) {
          // Há marcadores: cada parte vira uma seção com a imagem correspondente
          const secs = parts.map((part, idx) => ({
            id:      `sec-ai-${idx}-${Date.now()}`,
            name:    idx === 0 ? 'Artigo Completo' : `Continuação ${idx}`,
            content: part,
            images:  selImgs[idx] ? [selImgs[idx]] : [],
          }));
          // Imagens extras (mais imagens do que marcadores) acumulam na última seção
          selImgs.slice(parts.length).forEach(url => {
            if (secs.length > 0) secs[secs.length - 1].images.push(url);
          });
          return secs.filter(s => s.content || s.images.length > 0);
        }

        /*
          Fallback: a IA não usou marcadores → divide o texto no meio como antes.
          Isso garante que posts sem imagens (ou gerados antes deste sistema)
          ainda funcionem corretamente no modo "intercaladas".
        */
        if (selImgs.length > 0) {
          const paragraphs = bodyText.split(/\n\n+/).filter(s => s.trim());
          const half1      = paragraphs.slice(0, Math.ceil(paragraphs.length / 2)).join('\n\n');
          const half2      = paragraphs.slice(Math.ceil(paragraphs.length / 2)).join('\n\n');
          const imgHalf    = Math.ceil(selImgs.length / 2);
          return [
            { id: 'sec-ai-1-' + Date.now(), name: 'Artigo Completo', content: half1, images: selImgs.slice(0, imgHalf) },
            { id: 'sec-ai-2-' + Date.now(), name: 'Continuação',     content: half2, images: selImgs.slice(imgHalf)    },
          ].filter(s => s.content || s.images.length > 0);
        }
      }

      /*
        Modo 'gallery' (ou 'split' sem imagens): seção única.
        Remove marcadores [IMAGEM] do texto caso a IA os tenha inserido
        mesmo com o modo galeria — evita lixo textual no post publicado.
      */
      return [{ id: 'sec-ai-' + Date.now(), name: 'Artigo Completo', content: bodyText.replace(/\[IMAGEM\]/gi, '').trim(), images: selImgs }];
    })(),
    youtubeUrl:  null,      // sem vídeo
    aiGenerated: true,      // marca que foi gerado por IA (útil para filtragem futura)
    steamUrl:    p.steamUrl || null, // link para o post original na Steam
  };

  const posts = getPosts();
  posts.unshift(newPost); // adiciona no início (post mais recente aparece primeiro no site)
  savePosts(posts);

  S.pendingPosts.splice(idx, 1); // remove da lista de pendentes (splice remove 1 item na posição idx)
  savePending();
  addLog(`✅ Publicado no site: "${newPost.title}"`, 'success');
  showToast('Post publicado! Aparece no site agora.');
  renderContent();
  updateTabLabels();
}

/*
  Remove um post pendente sem publicar.
  splice(idx, 1) → remove 1 elemento na posição idx do array.
*/
function deletePending(idx) {
  S.pendingPosts.splice(idx, 1);
  savePending();
  renderContent();
  updateTabLabels();
}

/*
  Abre/fecha o formulário de edição de um post.
  POR QUE usar um campo 'editing' no próprio objeto do post?
  → Simplifica o controle: não precisamos de uma variável separada
    para saber qual post está sendo editado. Cada post carrega
    seu próprio estado de edição.
*/
function toggleEdit(idx) {
  const p = S.pendingPosts[idx];
  if (p) { p.editing = !p.editing; renderContent(); }
}

/*
  Salva as alterações feitas no formulário de edição.
  POR QUE || p.title (fallback para o valor original)?
  → Se o admin apagar o título e salvar, o post ficaria sem título.
    O fallback garante que o valor original seja mantido se o campo ficar vazio.
*/
function saveEdit(idx) {
  const p = S.pendingPosts[idx];
  if (!p) return;
  // Função auxiliar: busca o elemento pelo id e retorna o valor sem espaços extras
  const v = id => document.getElementById(id)?.value.trim();
  p.title   = v(`et-${idx}`) || p.title;
  p.desc    = v(`ed-${idx}`) || p.desc;
  p.body    = v(`eb-${idx}`) || p.body;
  p.emoji   = v(`ee-${idx}`) || p.emoji;
  p.editing = false; // fecha o formulário
  savePending();
  addLog(`✏️ Post editado: "${p.title}"`, 'info');
  renderContent();
}

/* Muda a tag/categoria de um post pendente */
function setTag(idx, tag) {
  const p = S.pendingPosts[idx];
  if (p) { p.tags = [tag]; savePending(); renderContent(); }
}


// ===========================================================
// GERENCIAMENTO DE IMAGENS NO EDITOR DO AGENTE
// ===========================================================
/*
  Cada função abaixo manipula os campos selectedImages, coverImage
  e imgPlacement do post pendente, depois salva e re-renderiza.

  POR QUE não editar p.images diretamente?
  → p.images é o "pool" completo de imagens encontradas — nunca
    é modificado. p.selectedImages é o subconjunto que o admin
    escolheu incluir no post. Isso permite desmarcar e re-marcar
    imagens sem perder as que estavam disponíveis.
*/

/* Liga/desliga a seleção de uma imagem. Se era a capa, troca a capa. */
function toggleImage(postIdx, url) {
  const p   = S.pendingPosts[postIdx];
  if (!p) return;
  const sel = p.selectedImages || [];
  const i   = sel.indexOf(url);
  if (i >= 0) {
    // Removendo: se era a capa, passa a capa para a próxima selecionada
    p.selectedImages = sel.filter(u => u !== url);
    if (p.coverImage === url) p.coverImage = p.selectedImages[0] || null;
  } else {
    p.selectedImages = [...sel, url];
    // Se não havia nenhuma selecionada, a primeira se torna capa automaticamente
    if (!p.coverImage) p.coverImage = url;
  }
  savePending(); renderContent();
}

/* Define qual imagem é a capa do card. Seleciona automaticamente se não estava. */
function setCover(postIdx, url) {
  const p = S.pendingPosts[postIdx];
  if (!p) return;
  if (!(p.selectedImages || []).includes(url)) {
    p.selectedImages = [...(p.selectedImages || []), url];
  }
  p.coverImage = url;
  savePending(); renderContent();
}

/* Move uma imagem uma posição acima na ordem de selectedImages. */
function moveImgUp(postIdx, url) {
  const p = S.pendingPosts[postIdx];
  if (!p) return;
  const sel = [...(p.selectedImages || [])];
  const i   = sel.indexOf(url);
  if (i > 0) { [sel[i-1], sel[i]] = [sel[i], sel[i-1]]; }
  p.selectedImages = sel;
  savePending(); renderContent();
}

/* Move uma imagem uma posição abaixo na ordem de selectedImages. */
function moveImgDown(postIdx, url) {
  const p = S.pendingPosts[postIdx];
  if (!p) return;
  const sel = [...(p.selectedImages || [])];
  const i   = sel.indexOf(url);
  if (i >= 0 && i < sel.length - 1) { [sel[i], sel[i+1]] = [sel[i+1], sel[i]]; }
  p.selectedImages = sel;
  savePending(); renderContent();
}

/* Seleciona ou desseleciona TODAS as imagens de uma vez. */
function selectAllImgs(postIdx, selectAll) {
  const p = S.pendingPosts[postIdx];
  if (!p) return;
  if (selectAll) {
    p.selectedImages = [...(p.images || [])];
    if (!p.coverImage && p.selectedImages.length > 0) p.coverImage = p.selectedImages[0];
  } else {
    p.selectedImages = [];
    p.coverImage     = null;
  }
  savePending(); renderContent();
}

/* Define o modo de posicionamento das imagens no artigo publicado. */
function setImgPlacement(postIdx, mode) {
  const p = S.pendingPosts[postIdx];
  if (!p) return;
  p.imgPlacement = mode;
  savePending(); renderContent();
}
