<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'; script-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página não encontrada · Drakbuilder</title>
  <link rel="stylesheet" href="/fontes/fontes.css" />
  <style>
    :root { --bg:#15120f; --card:#1d1915; --text:#ede4d3; --sec:#b3a690; --ember:#e0782f; --brass:#d9a441; --border:#3a3129; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:1.05rem/1.65 'Alegreya Sans', system-ui, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 2.5rem 16px 4rem; }
    h1 { font-family:'Pixelify Sans', sans-serif; color:var(--brass); font-size:2rem; margin:0 0 .25rem; }
    h2 { color:var(--ember); font-size:1.25rem; margin:2.25rem 0 .5rem; }
    p, li { color:var(--text); }
    .meta { color:var(--sec); margin-bottom:2rem; }
    a { color:var(--ember); }
    .caixa { background:var(--card); border:1px solid var(--border); padding:1rem 1.25rem; margin:1rem 0; }
    table { width:100%; border-collapse:collapse; margin:.5rem 0 1rem; font-size:.97rem; }
    th, td { border:1px solid var(--border); padding:.5rem .6rem; text-align:left; vertical-align:top; }
    th { background:var(--card); color:var(--brass); }
    .voltar { display:inline-block; margin-bottom:1.5rem; }
  </style>
</head>
<body>
<main>
  <h1>Página não encontrada</h1>
  <p class="meta">Erro 404</p>
  <p>Este endereço não existe no Drakbuilder. Ele pode ter mudado ou o link pode estar errado.</p>
  <p><a href="/">← Ir para o início</a> · <a href="/#/builds">Builds</a> · <a href="/#/novidades">Notícias</a> · <a href="/#/guias">Guias</a></p>
</main>
</body>
</html>
